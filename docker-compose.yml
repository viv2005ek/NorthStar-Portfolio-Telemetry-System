services:
  postgres:
    image: postgres:16-alpine
    container_name: northstar-postgres
    restart: always
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northstar"]
      interval: 3s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: northstar-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: northstar
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: dev_northstar_jwt_secret_key_2026
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: northstar-frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
